---
name: lyd-atomic-nvidia
description: Minimal KDE Atomic workstation with the proprietary NVIDIA 580 driver.
base-image: ghcr.io/blue-build/base-images/fedora-kinoite-nvidia
image-version: "45"
modules:
  - type: dnf
    install:
      packages:
        - dolphin
        - konsole
        - kate
        - ark
        - okular
        - spectacle
        - kcalc
        - plasma-discover
        - plasma-discover-flatpak
        - sddm-breeze
        - flatpak
        - git
        - curl
        - wget
        - jq
        - python3
        - python3-pip
        - bash-completion
        - htop
        - fastfetch
        - btrfs-progs
        - util-linux
        - grub2-tools
        - grub2-tools-extra
        - plymouth
        - plymouth-plugin-script
        - plymouth-scripts
        - librsvg2-tools
        - xcursorgen
        - aurorae
        - breeze-icon-theme
        - hicolor-icon-theme
        - gtk-update-icon-cache
        - fuse
        - fuse-libs
        - fuse3
        - fuse3-libs
        - xdg-desktop-portal
        - xdg-desktop-portal-kde
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - plasma-discover-rpm-ostree
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://flathub.org/repo/flathub.flatpakrepo
        install:
          - net.waterfox.waterfox
          - org.kde.haruna
          - org.kde.gwenview
          - com.vixalien.sticky
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    scripts:
      - install-lyd-tools.sh
      - install-mystical-theme.sh
      - configure-workstation.sh
      - enable-bib-repositories.sh
