---
name: lyd-atomic-server
description: Headless Fedora bootc server with Podman, Cockpit, KVM virtualization and firewalld.
base-image: quay.io/fedora/fedora-bootc
image-version: "45"
modules:
  - type: dnf
    repos:
      copr:
        - codifryed/CoolerControl
    install:
      packages:
        - podman
        - podman-compose
        - buildah
        - skopeo
        - cockpit
        - cockpit-ws
        - cockpit-system
        - cockpit-podman
        - cockpit-machines
        - cockpit-storaged
        - cockpit-networkmanager
        - cockpit-selinux
        - cockpit-sosreport
        - cockpit-files
        - firewalld
        - openssh-server
        - openssh-clients
        - qemu-kvm
        - libvirt
        - libvirt-daemon-kvm
        - libvirt-daemon-config-network
        - virt-install
        - edk2-ovmf
        - swtpm
        - dnsmasq
        - btrfs-progs
        - curl
        - wget
        - git
        - jq
        - python3
        - bash-completion
        - htop
        - fastfetch
        - tmux
        - vim-enhanced
        - nano
        - tuned
        - tuned-ppd
        - tailscale
        - solaar
        - distrobox
        - coolercontrol
        - coolercontrold
        - liquidctl
    remove:
      packages: []
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    scripts:
      - install-lyd-tools.sh
      - enable-bib-repositories.sh
      - configure-server.sh
  - type: systemd
    system:
      enabled:
        - cockpit.socket
        - firewalld.service
        - sshd.service
        - libvirtd.service
        - lyd-enable-user-linger.service
        - lyd-enable-user-linger.path
