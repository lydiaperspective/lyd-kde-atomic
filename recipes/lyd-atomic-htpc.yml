---
name: lyd-atomic-htpc
description: Lightweight KDE Plasma Bigscreen HTPC with controller-friendly navigation and living-room media apps.
base-image: quay.io/fedora/fedora-bootc
image-version: "45"
modules:
  - type: dnf
    repos:
      free: rpmfusion
    install:
      packages:
        - plasma-bigscreen
        - plasma-bigscreen-wayland
        - plasma-workspace-wayland
        - sddm
        - sddm-breeze
        - breeze-icon-theme
        - hicolor-icon-theme
        - NetworkManager
        - NetworkManager-wifi
        - wpa_supplicant
        - wireless-regdb
        - linux-firmware
        - flatpak
        - xdg-desktop-portal
        - xdg-desktop-portal-kde
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - wireplumber
        - bluez
        - bluez-tools
        - steam-devices
        - evtest
        - libva-intel-driver
        - libva-utils
        - mesa-dri-drivers
        - ffmpeg-free
        - curl
        - jq\n        - python3-aiohttp\n        - python3-evdev\n        - qrencode
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://flathub.org/repo/flathub.flatpakrepo
        install:
          - org.jellyfin.JellyfinDesktop
          - com.unicornsonlsd.finamp
          - com.spotify.Client
          - org.fcast.Receiver
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    scripts:
      - configure-htpc.sh
