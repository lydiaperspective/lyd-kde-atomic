---
name: lyd-atomic-htpc
description: Lightweight KDE Plasma Bigscreen HTPC with controller-friendly navigation and living-room media apps.
base-image: quay.io/fedora/fedora-bootc
image-version: "45"
modules:
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - plasma-bigscreen
        - plasma-bigscreen-wayland
        - plasma-discover
        - plasma-discover-flatpak
        - plasma-workspace-wayland
        - plasma-nm
        - sddm
        - sddm-breeze
        - breeze-icon-theme
        - hicolor-icon-theme
        - NetworkManager
        - NetworkManager-wifi
        - wpa_supplicant
        - wireless-regdb
        - iw
        - rfkill
        - linux-firmware
        - atheros-firmware
        - brcmfmac-firmware
        - iwlbluetooth-firmware
        - iwlegacy-firmware
        - iwlwifi-mld-firmware
        - libertas-firmware
        - mediatek-firmware
        - mt7xxx-firmware
        - nxpwireless-firmware
        - realtek-firmware
        - tiwilink-firmware
        - iwlwifi-mvm-firmware
        - iwlwifi-dvm-firmware
        - flatpak
        - xdg-desktop-portal
        - xdg-desktop-portal-kde
        - pipewire
        - pipewire-alsa
        - pipewire-pulseaudio
        - wireplumber
        - bluez
        - bluez-obexd
        - bluedevil
        - bluez-tools
        - steam-devices
        - evtest
        - libva-intel-driver
        - libva-utils
        - mesa-dri-drivers
        - ffmpeg-free
        - curl
        - jq
        - python3-aiohttp
        - python3-evdev
        - qrencode
        - tailscale
    # Discover on this bootc image is Flatpak-only. Remove the RPM/PackageKit
    # backends inherited or pulled in by weak dependencies; they try to start
    # PackageKit, which is not a supported package-management path here.
    remove:
      packages:
        - plasma-discover-offline-updates
        - plasma-discover-packagekit
        - plasma-discover-rpm-ostree
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://flathub.org/repo/flathub.flatpakrepo
        install:
          - org.jellyfin.JellyfinDesktop
          - com.unicornsonlsd.finamp
          - com.spotify.Client
          - app.grayjay.Grayjay
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    scripts:
      - configure-htpc.sh
