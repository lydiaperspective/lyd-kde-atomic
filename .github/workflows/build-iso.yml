name: Build installable ISO

on:
  workflow_dispatch:
    inputs:
      image_flavour:
        description: Hardware image to install
        type: choice
        required: true
        default: workstation
        options:
          - workstation
          - nvidia-gaming
          - server
          - htpc
      image_tag:
        description: Published image tag to convert
        required: true
        default: latest

concurrency:
  group: single-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ISO
        env:
          IMAGE_FLAVOUR: ${{ inputs.image_flavour }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          mkdir -p output
          case "$IMAGE_FLAVOUR" in
            workstation) IMAGE_NAME="lyd-atomic-workstation" ;;
            nvidia-gaming) IMAGE_NAME="lyd-atomic-nvidia-gaming" ;;
            server) IMAGE_NAME="lyd-atomic-server" ;;
            htpc) IMAGE_NAME="lyd-atomic-htpc" ;;
            *) echo "Unknown image flavour: $IMAGE_FLAVOUR" >&2; exit 1 ;;
          esac
          IMAGE="ghcr.io/lydiaperspective/$IMAGE_NAME:$IMAGE_TAG"
          sudo podman pull "$IMAGE"

          echo "Checking repository configuration inside $IMAGE before ISO conversion"
          sudo podman run --rm --entrypoint /bin/bash "$IMAGE" -lc '
            set -Eeuo pipefail
            echo "Repository directories:"
            ls -la /etc/yum.repos.d /usr/share/dnf5/repos.d 2>/dev/null || true
            echo
            echo "DNF5 enabled repositories:"
            dnf5 repo list --enabled
          '

          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            "$IMAGE"

      - name: Publish ISO to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sudo chown -R "$(id -u):$(id -g)" output
          bash files/scripts/publish-iso-release.sh "${{ inputs.image_flavour }}" "${{ inputs.image_tag }}" output

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyd-atomic-${{ inputs.image_flavour }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 14
