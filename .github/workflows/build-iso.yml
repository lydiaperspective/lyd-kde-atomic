name: Build installable ISO

on:
  workflow_dispatch:
    inputs:
      image_flavour:
        description: Hardware image to install
        type: choice
        required: true
        default: standard
        options:
          - nvidia
          - standard
          - server
      image_tag:
        description: Published image tag to convert
        required: true
        default: latest
      rootfs_type:
        description: Filesystem for the installed system
        type: choice
        required: true
        default: btrfs
        options:
          - btrfs
          - xfs
          - ext4

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build ISO
        env:
          IMAGE_FLAVOUR: ${{ inputs.image_flavour }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROOTFS_TYPE: ${{ inputs.rootfs_type }}
        run: |
          mkdir -p output
          case "$IMAGE_FLAVOUR" in
            nvidia) IMAGE_NAME="lyd-atomic-nvidia" ;;
            standard) IMAGE_NAME="lyd-atomic-standard" ;;
            server) IMAGE_NAME="lyd-atomic-server" ;;
            *) echo "Unknown image flavour: $IMAGE_FLAVOUR" >&2; exit 1 ;;
          esac
          case "$ROOTFS_TYPE" in
            btrfs|xfs|ext4) ;;
            *) echo "Unsupported root filesystem: $ROOTFS_TYPE" >&2; exit 1 ;;
          esac
          IMAGE="ghcr.io/lydiaperspective/$IMAGE_NAME:$IMAGE_TAG"
          sudo podman pull "$IMAGE"

          echo "Checking repository configuration inside $IMAGE before ISO conversion"
          sudo podman run --rm --entrypoint /bin/bash "$IMAGE" -lc '
            set -Eeuo pipefail
            echo "Repository directories:"
            ls -la /etc/yum.repos.d /usr/share/dnf5/repos.d 2>/dev/null || true
            echo
            echo "DNF5 enabled repositories:"
            dnf5 repo list --enabled
          '

          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs "$ROOTFS_TYPE" \
            "$IMAGE"
      - name: Generate checksums
        run: |
          find output -type f -name '*.iso' -print0 | while IFS= read -r -d '' iso; do
            sha256sum "$iso" > "$iso.sha256"
          done
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyd-atomic-${{ inputs.image_flavour }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 14
