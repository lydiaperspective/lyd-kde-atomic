name: Build installable ISO

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published image tag to convert
        required: true
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build ISO
        env:
          IMAGE: ghcr.io/lydiaperspective/lyd-kde-atomic:${{ inputs.image_tag }}
        run: |
          mkdir -p output
          sudo podman pull "$IMAGE"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso "$IMAGE"
      - name: Generate checksums
        run: |
          find output -type f -name '*.iso' -print0 | while IFS= read -r -d '' iso; do
            sha256sum "$iso" > "$iso.sha256"
          done
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyd-kde-atomic-iso
          path: output/
          if-no-files-found: error
          retention-days: 14
