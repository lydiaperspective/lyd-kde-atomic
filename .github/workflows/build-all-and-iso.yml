name: Build all images and latest ISO

on:
  workflow_dispatch:
    inputs:
      image_flavour:
        description: Edition to package into the ISO after all images build
        type: choice
        required: true
        default: workstation
        options:
          - workstation
          - nvidia-gaming
          - server

concurrency:
  group: build-all-and-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-components:
    name: Build ${{ matrix.flavour }} component image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: base
            recipe: lyd-atomic-base.yml
          - flavour: nvidia
            recipe: lyd-atomic-nvidia.yml
          - flavour: nvidia-open
            recipe: lyd-atomic-nvidia-open.yml
          - flavour: server
            recipe: lyd-server.yml
    steps:
      - name: Build and publish ${{ matrix.flavour }} component
        uses: blue-build/github-action@v1
        with:
          recipe: recipes/${{ matrix.recipe }}
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: 0
          push: true
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}

  build-final:
    name: Build final ${{ matrix.flavour }} image
    needs: build-components
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: workstation
            recipe: lyd-atomic-workstation.yml
          - flavour: nvidia-gaming
            recipe: lyd-atomic-nvidia-gaming.yml
          - flavour: steamdeck
            recipe: lyd-atomic-steamdeck.yml
    steps:
      - name: Build and publish ${{ matrix.flavour }}
        uses: blue-build/github-action@v1
        with:
          recipe: recipes/${{ matrix.recipe }}
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: 0
          push: true
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}

  iso:
    name: Build and release latest ${{ inputs.image_flavour }} ISO
    needs: [build-components, build-final]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build ISO from newly published latest image
        env:
          IMAGE_FLAVOUR: ${{ inputs.image_flavour }}
        run: |
          set -Eeuo pipefail
          mkdir -p output

          case "$IMAGE_FLAVOUR" in
            workstation) IMAGE_NAME="lyd-atomic-workstation" ;;
            nvidia-gaming) IMAGE_NAME="lyd-atomic-nvidia-gaming" ;;
            server) IMAGE_NAME="lyd-atomic-server" ;;
            *) echo "Unknown image flavour: $IMAGE_FLAVOUR" >&2; exit 1 ;;
          esac


          IMAGE="ghcr.io/lydiaperspective/$IMAGE_NAME:latest"
          echo "Pulling newly published image: $IMAGE"
          sudo podman pull "$IMAGE"

          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            "$IMAGE"

      - name: Publish ISO to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sudo chown -R "$(id -u):$(id -g)" output
          bash files/scripts/publish-iso-release.sh "${{ inputs.image_flavour }}" latest output

      - name: Upload ISO build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyd-atomic-${{ inputs.image_flavour }}-latest-iso
          path: output/
          if-no-files-found: error
          retention-days: 14
