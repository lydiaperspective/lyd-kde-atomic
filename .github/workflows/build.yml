name: Build Lyd Atomic

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-components:
    name: Build ${{ matrix.flavour }} component image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: base
            recipe: lyd-atomic-base.yml
          - flavour: nvidia
            recipe: lyd-atomic-nvidia.yml
          - flavour: nvidia-open
            recipe: lyd-atomic-nvidia-open.yml
          - flavour: server
            recipe: lyd-server.yml
    steps:
      - name: Build and publish ${{ matrix.flavour }} image
        uses: blue-build/github-action@v1
        with:
          recipe: recipes/${{ matrix.recipe }}
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: ${{ github.event.number || 0 }}
          push: ${{ github.event_name != 'pull_request' }}
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}

  build-final:
    name: Build final ${{ matrix.flavour }} image
    needs: build-components
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: workstation
            recipe: lyd-atomic-workstation.yml
          - flavour: nvidia-gaming
            recipe: lyd-atomic-nvidia-gaming.yml
    steps:
      - name: Build and publish ${{ matrix.flavour }} image
        uses: blue-build/github-action@v1
        with:
          recipe: recipes/${{ matrix.recipe }}
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: 0
          push: true
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}
