name: Build Lyd Atomic

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-base:
    name: Build shared workstation base
    runs-on: ubuntu-24.04
    steps:
      - name: Build and publish lyd-atomic-base
        uses: blue-build/github-action@v1
        with:
          recipe: lyd-atomic-base.yml
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: ${{ github.event.number || 0 }}
          push: ${{ github.event_name != 'pull_request' }}
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}

  build-fcast:
    name: Build patched FCast Receiver Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Fetch pinned Flathub manifest
        run: |
          git clone --depth 1 https://github.com/flathub/org.fcast.Receiver.git /tmp/fcast-flatpak
          cp files/patches/fcast-htpc-autoshow.patch /tmp/fcast-flatpak/
          sed -i '/commit: 54b70120c44733140ed8a958603d6dbb71030b38/a\\        patches:\\n          - type: file\\n            path: fcast-htpc-autoshow.patch' /tmp/fcast-flatpak/org.fcast.Receiver.yaml
      - name: Build FCast Flatpak
        working-directory: /tmp/fcast-flatpak
        run: |
          flatpak-builder --force-clean --repo=repo build-dir org.fcast.Receiver.yaml --install-deps-from=flathub
          flatpak build-bundle repo fcast-htpc.flatpak org.fcast.Receiver
      - uses: actions/upload-artifact@v4
        with:
          name: fcast-htpc-flatpak
          path: /tmp/fcast-flatpak/fcast-htpc.flatpak
          if-no-files-found: error
          retention-days: 7

  build-components:
    name: Build ${{ matrix.flavour }} component image
    needs: [build-base, build-fcast]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: nvidia
            recipe: lyd-atomic-nvidia.yml
          - flavour: nvidia-open
            recipe: lyd-atomic-nvidia-open.yml
          - flavour: server
            recipe: lyd-server.yml
          - flavour: htpc
            recipe: lyd-atomic-htpc.yml
    steps:
      - uses: actions/checkout@v4
      - name: Download patched FCast Flatpak for HTPC
        if: matrix.flavour == 'htpc'
        uses: actions/download-artifact@v4
        with:
          name: fcast-htpc-flatpak
          path: files/system/usr/share/lyd/flatpaks
      - name: Build and publish ${{ matrix.flavour }} image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: ${{ github.event.number || 0 }}
          push: ${{ github.event_name != 'pull_request' }}
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}

  build-final:
    name: Build final ${{ matrix.flavour }} image
    needs: [build-base, build-components]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: workstation
            recipe: lyd-atomic-workstation.yml
          - flavour: nvidia-gaming
            recipe: lyd-atomic-nvidia-gaming.yml
    steps:
      - name: Build and publish ${{ matrix.flavour }} image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          registry: ghcr.io
          registry_namespace: lydiaperspective
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_public_key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          pr_event_number: 0
          push: true
          maximize_build_space: true
          build_opts: ${{ (secrets.COSIGN_PRIVATE_KEY != '' && secrets.COSIGN_PUBLIC_KEY != '') && '' || '--no-sign' }}
