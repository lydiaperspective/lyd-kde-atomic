<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyd Remote Pairing</title><style>body{background:#10131a;color:#fff;font:24px system-ui;text-align:center;padding:5vh}button{font-size:24px;padding:18px 32px}code{font-size:20px}</style><h1>Pair a phone remote</h1><p>Open the remote on your phone and enter the pairing code displayed here.</p><button onclick="start()">Generate pairing code</button><h2 id="code"></h2><p id="timer"></p><script>async function start(){let r=await fetch('/api/pair/start',{method:'POST'}),d=await r.json();document.querySelector('#code').textContent=d.code;document.querySelector('#timer').textContent='Expires in 3 minutes. Enter this code on the phone.';}</script></html>
