<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyd Remote Pairing</title><style>body{background:#10131a;color:#fff;font:24px system-ui;text-align:center;padding:5vh}img{width:min(48vh,70vw);background:white;padding:18px;border-radius:12px}#wait{font-size:20px;color:#bbc2cf}</style><h1>Pair a phone remote</h1><p id="wait">Waiting for a phone to request pairing…</p><img id="qr" hidden><script>async function poll(){try{let r=await fetch('/api/pair/pending'),d=await r.json(),img=document.querySelector('#qr'),w=document.querySelector('#wait');if(d.active){img.hidden=false;img.src='/api/pair/qr?t='+Date.now();w.textContent='Scan this QR code with your phone camera. It expires in 3 minutes.'}else{img.hidden=true;w.textContent='Waiting for a phone to request pairing…'}}catch(e){}setTimeout(poll,2000)}poll()</script></html>
