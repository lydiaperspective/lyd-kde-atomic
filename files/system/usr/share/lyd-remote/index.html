<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lyd HTPC Remote</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17191f;color:#f4f4f5;font:16px system-ui;display:flex;flex-direction:column;height:100dvh}header{display:flex;gap:8px;padding:12px;background:#242832}button{border:0;border-radius:12px;padding:13px 10px;background:#383e4c;color:white;font-size:16px}header button{flex:1}.pad{flex:1;margin:12px;border:2px solid #414958;border-radius:18px;display:grid;place-items:center;touch-action:none;color:#9ca3af;user-select:none}footer{padding:12px;display:flex;gap:8px}footer input{min-width:0;flex:1;padding:13px;border-radius:10px;border:0;font-size:17px}#pair{background:#a8c7fa;color:#151922}</style>
<header><button onclick="send('home')">⌂ Home</button><button onclick="send('back')">← Back</button><button onclick="send('apps')">▦ Apps</button><button id="pair" onclick="pair()">Pair</button></header>
<div class="pad" id="pad">Touchpad · drag to move · tap to click</div><footer><input id="text" placeholder="Use your phone keyboard…" autocomplete="off"><button onclick="sendText()">Send</button></footer>
<script>
let token=localStorage.getItem('lyd-token')||'';
async function api(path,body,method='POST'){return fetch(path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined})}
async function send(action){if(!token){alert('Pair this phone first.');return}await api('/api/control',{action})}
async function sendText(){let i=document.querySelector('#text');if(!token){alert('Pair this phone first.');return}await api('/api/text',{text:i.value});i.value='';}
let pad=document.querySelector('#pad'),last=null,moved=false;
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);last=[e.clientX,e.clientY];moved=false});
pad.addEventListener('pointermove',e=>{if(!last)return;let dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];if(Math.abs(dx)+Math.abs(dy)>0){moved=true;if(token)api('/api/control',{action:'move',dx:Math.round(dx*1.8),dy:Math.round(dy*1.8)})}});
pad.addEventListener('pointerup',()=>{if(last&&!moved)send('click');last=null});
async function pair(){let r=await api('/api/pair/start',{});if(!r.ok){alert('Could not start pairing');return}alert('A pairing QR code will appear on the TV. Scan it with your phone camera to finish pairing.');}
</script></html>
